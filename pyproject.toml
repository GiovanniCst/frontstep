[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frontstep"
dynamic = ["version"]
description = "One page with the status of every project you have — derived from a file your agent keeps up to date"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["dashboard", "projects", "status", "agents", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "Flask>=3.0",
    "mistune>=3.0",
    # Imported directly by `web.py`, so it is declared directly. It arrives with
    # Flask anyway — depending on that is depending on somebody else's
    # dependency tree staying the shape it is today.
    "MarkupSafe>=2.1",
]

[project.scripts]
frontstep = "frontstep.cli:main"

[project.optional-dependencies]
# A production server. For local use Flask's own is enough.
server = ["gunicorn>=22.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.version]
path = "src/frontstep/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/frontstep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
